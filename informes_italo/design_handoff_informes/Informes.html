<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informes</title>
<style>
:root{--ink:#1c2024;--muted:#6f767e;--muted2:#9aa3ab;--line:#e8eaed;--card:#f6f7f9;--panel:#eef0f2;--blue:#2f78e8;--send:#5b9bf0;--avBg:#cfe0f7;--avInk:#3b6fd4;--navy:#2b1f5c;--red:#e2543b;--tint:#f2f6fd;--tintLine:#d8e4f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#dfe2e6;color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:100%;padding:22px 12px 40px;gap:14px}
a{color:var(--blue)}a:hover{color:#1f5fc4}
button{font:inherit;color:inherit}
.demo-toggle{display:inline-flex;align-items:center;background:#cfd3d9;border-radius:999px;padding:4px;gap:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);font-size:13px;user-select:none}
.demo-toggle .dt-l{padding:0 8px 0 12px;color:#5a6068;font-weight:600}
.demo-toggle button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:#5a6068;cursor:pointer;transition:.18s}
.demo-toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.phone{width:392px;max-width:100%;height:812px;background:#fff;border-radius:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(20,24,30,.28),0 0 0 9px #11151b,0 0 0 10px #2a2f37}
.statusbar{height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:600;color:#22262b;background:#fff}
.sb-right{display:flex;align-items:center;gap:6px}.sb-right .bar{width:3px;border-radius:1px;background:#22262b}
.sb-batt{font-size:10px;background:#22262b;color:#fff;border-radius:5px;padding:1px 5px;font-weight:700}
.screen{flex:1;position:relative;overflow:hidden;background:#fff}
.navbar{height:46px;flex:0 0 auto;background:#11151b;display:flex;align-items:center;justify-content:space-around;color:#cfd3d9}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
/* buttons */
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:disabled{background:#c9d7ee;cursor:default}
.btn.outline{background:#fff;border:1px solid #d5d9de;color:var(--ink)}
.btn.ghost{background:var(--panel);color:#4a5058}
.btn.dark{background:var(--ink);color:#fff}
/* list */
.lh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 2px}
.lh h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.01em}
.lsub{padding:0 18px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.list{flex:1;overflow-y:auto}.list::-webkit-scrollbar{width:0}
.li{display:flex;gap:10px;width:100%;text-align:left;border:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px 15px;cursor:pointer}
.li:hover{background:#fafbfc}
.li-st{flex:0 0 18px;padding-top:4px;display:flex;justify-content:center}
.st-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);display:inline-block}
.st-ck{width:17px;height:17px;border-radius:50%;background:#e4e7eb;color:#7a8087;display:flex;align-items:center;justify-content:center}
.li-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.li-t{display:flex;align-items:center;gap:8px}
.li-t .tt{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.closed .li-t .tt{color:#4a5058}
.tag{flex:0 0 auto;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel);border-radius:6px;padding:2px 7px}
.li-m{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.li-m i{font-style:normal;color:var(--muted2)}
.li-f{display:inline-flex;align-items:center;gap:3px;margin-left:4px;color:#5a6068;font-weight:600}
.li-p{font-size:13.5px;color:#565c63;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.li-men{align-self:flex-start;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--avInk);background:#e6eefb;border-radius:999px;padding:2px 9px}
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:14px}
/* thread header */
.th{height:54px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 6px;border-bottom:1px solid var(--line)}
.th-back{border:0;background:transparent;display:flex;align-items:center;gap:2px;font-size:15.5px;font-weight:600;color:var(--blue);cursor:pointer;padding:8px 6px}
.th-title{font-weight:700;font-size:15.5px}
.th-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 10px}
.pill.open{background:#e6eefb;color:#2459b8}.pill.open .st-dot{width:7px;height:7px}
.pill.closed{background:var(--panel);color:#5a6068}
.tbody{flex:1;overflow-y:auto;padding:12px 0 18px}.tbody::-webkit-scrollbar{width:0}
/* entries */
.ent{padding:13px 18px 14px;border-bottom:1px solid var(--line)}
.ent.initial{margin:0 12px 6px;border:1px solid var(--tintLine);background:var(--tint);border-radius:16px;padding:12px 14px 14px}
.ent-lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--avInk);margin-bottom:10px}
.ent-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ent-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ent-who b{font-size:14.5px}
.when{font-size:12px;color:var(--muted)}
.edit-b{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:#4a5058;display:flex;align-items:center;gap:5px;cursor:pointer}
.edit-b:hover{background:var(--card)}
.men-tag{font-size:11px;font-weight:700;color:var(--avInk);background:#e6eefb;border-radius:999px;padding:3px 8px}
.ent.initial .men-tag{background:#fff}
.ent-body{font-size:15px;line-height:1.5;color:#2c3035;padding-left:46px}
.ent.initial .ent-body{padding-left:0;font-size:15.5px}
.ent .atts{padding-left:46px}.ent.initial .atts{padding-left:0}
.ent.editing{background:#fbfcfd}
.ent.initial.editing{background:var(--tint)}
.av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--avBg);color:var(--avInk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px}
.rich div{min-height:1.2em}.rich ul,.rich ol{margin:4px 0;padding-left:22px}.rich li{margin:2px 0}
.mention{display:inline;background:#dde8fb;color:#2459b8;border-radius:999px;padding:1px 8px;font-weight:600;font-size:.94em;white-space:nowrap;-webkit-box-decoration-break:clone}
.ent-close{display:flex;gap:11px;margin:14px 18px 0;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.ec-ic{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.ec-b{flex:1;line-height:1.4;padding-top:4px}
.ec-t{margin-top:6px;color:#3a3f45}
.ro-end{text-align:center;font-size:12.5px;color:var(--muted2);padding:18px 0 4px}
/* attachments */
.atts{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.att-media{display:flex;flex-wrap:wrap;gap:7px}
.att-thumb-w,.att-chip-w{position:relative}
.att-thumb{width:76px;height:76px;border-radius:11px;overflow:hidden;border:1px solid var(--line);padding:0;cursor:pointer;position:relative;display:block;background:#eee}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ph-play{width:30px;height:30px;border-radius:50%;background:rgba(17,21,27,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding-left:2px}
.ph-lbl{position:absolute;left:5px;bottom:5px;font-family:ui-monospace,Menlo,monospace;font-size:10px;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:5px}
.att-docs{display:flex;flex-wrap:wrap;gap:7px}
.att-chip{display:flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left}
.att-chip:hover{background:#fafbfc}
.att-chip .ext{flex:0 0 auto;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:5px 5px;min-width:34px;text-align:center}
.att-chip .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.att-chip .sz{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.att-rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:#4a5058;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
/* editor */
.tfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px 12px;background:#fff}
.editor{position:relative;border:1px solid #dadde2;border-radius:14px;background:#fff}
.editor:focus-within{border-color:#a9c4ef;box-shadow:0 0 0 3px rgba(47,120,232,.1)}
.editor.inline{margin-top:4px}
.tb{display:flex;align-items:center;gap:1px;padding:5px 6px;border-bottom:1px solid var(--line)}
.tb-b{width:32px;height:30px;border:0;background:transparent;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#4a5058;font-size:15px}
.tb-b:hover{background:var(--panel)}
.tb-b.on{background:#e3ecfb;color:#2459b8}
.tb-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tb-attw{position:relative}
.att-menu{position:absolute;bottom:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(20,24,30,.16);padding:5px;z-index:10;min-width:170px}
.att-menu.below{bottom:auto;top:calc(100% + 6px)}
.att-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:#33373c;text-align:left}
.att-menu button:hover{background:var(--card)}
.ed-atts{padding:4px 10px 2px}.ed-atts .atts{margin-top:8px}
.ed-atts .att-thumb{width:56px;height:56px}
.ed-row{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 12px}
.ed-wrap{flex:1;min-width:0;position:relative}
.ed{outline:none;font-size:15px;line-height:1.45;min-height:24px;max-height:110px;overflow-y:auto;padding:2px 0;color:#2c3035;word-break:break-word}
.editor.tall .ed{min-height:220px;max-height:none}
.editor.inline .ed{max-height:none}
.ed-ph{position:absolute;top:2px;left:0;color:var(--muted2);font-size:15px;line-height:1.45;pointer-events:none}
.send{flex:0 0 auto;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.send:disabled{background:#c9d7ee;cursor:default}
.ed-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 8px 8px}
.ed-actions .btn{padding:7px 14px;font-size:13.5px}
.mpick{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(20,24,30,.18);padding:6px;z-index:20}
.mpick.below{bottom:auto;top:calc(100% + 6px)}
.mpick-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2);padding:6px 8px 4px}
.mpick-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:9px;padding:7px 8px;cursor:pointer;text-align:left}
.mpick-row.on{background:#eef3fc}
.av.sm{width:32px;height:32px;font-size:12.5px}
.mp-t{display:flex;flex-direction:column;line-height:1.25}.mp-t b{font-size:14px}.mp-t small{font-size:12px;color:var(--muted)}
/* new */
.new-b{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.new-hint{font-size:13px;color:var(--muted);line-height:1.45;padding:0 4px}
.new-b .editor{display:flex;flex-direction:column}
/* sheet */
.sheet-ov{position:absolute;inset:0;z-index:30}
.sheet-bd{position:absolute;inset:0;background:rgba(17,21,27,.45);animation:fi .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 18px;animation:su .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:#dcdfe3;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
.sheet p{margin:0 0 12px;font-size:13.5px;color:var(--muted);line-height:1.45}
.sheet textarea{width:100%;border:1px solid #dadde2;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;resize:none;outline:none}
.sheet textarea:focus{border-color:#a9c4ef;box-shadow:0 0 0 3px rgba(47,120,232,.1)}
.sheet-a{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(100%)}}
/* viewer */
.viewer{position:absolute;inset:0;background:#0e1216;z-index:40;display:flex;flex-direction:column;color:#fff}
.v-top{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px}
.vx{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.vname{flex:1;min-width:0}.vname .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vname .s{font-size:12px;color:rgba(255,255,255,.55)}
.v-body{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px}
.v-img{width:330px;max-width:100%;height:420px;border-radius:8px;overflow:hidden;position:relative}
.v-img .ph-play{width:56px;height:56px}
.v-hero{text-align:center}.v-hero .big{width:92px;height:92px;border-radius:22px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
.v-hero .hn{font-size:16px;font-weight:700}.v-hero .hs{font-size:13px;color:rgba(255,255,255,.6);margin-top:5px}
.v-load{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,.7)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.v-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08)}
.v-sig{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.6)}
.v-dl{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="informes-ui.jsx"></script>
<script type="text/babel" src="informes-app.jsx"></script>
</body>
</html>
